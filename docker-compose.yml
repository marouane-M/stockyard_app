name: parc-stockage
services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATA_DIR: /data
      SITE_ORIGIN_LAT: ${SITE_ORIGIN_LAT:-33.110}
      SITE_ORIGIN_LON: ${SITE_ORIGIN_LON:--8.610}
      SITE_ORIGIN_ALT_M: ${SITE_ORIGIN_ALT_M:-0}
      SITE_HEADING_DEG: ${SITE_HEADING_DEG:-0}
      SITE_NAME: ${SITE_NAME:-Parc de démonstration}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAP_ENABLED: ${MAP_ENABLED:-true}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-Esri World Imagery · Esri, Maxar, Earthstar Geographics et contributeurs}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - stockyard-data:/data
    networks: [stockyard]
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PUBLIC_API_PORT: ${BACKEND_PORT:-8000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    networks: [stockyard]
    init: true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/runtime').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  stockyard-data:
networks:
  stockyard:
    driver: bridge
